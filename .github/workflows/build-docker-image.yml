name: build base docker image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-docker-image.yml'
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian Version'
        options:
          - 'trixie'
          - 'bookworm'
          - 'bullseye'
          - 'buster'
        required: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os-version: ["buster", "bullseye", "bookworm", "trixie"]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        # inputs.flavor is empty on push → build all flavors; manual runs
        # build only the selected one
        if: inputs.flavor == '' || inputs.flavor == matrix.os-version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:docker"
          file: "Dockerfile"
          build-args: |
            FLAVOR=${{ matrix.os-version }}
          push: true
          tags: "${{ secrets.DOCKERHUB_USERNAME }}/aufs-dkms-build:${{ matrix.os-version }}"
