name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly — catches upstream aufs branch changes and Debian kernel drift
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax check
        run: bash -n scripts/build.sh
      - name: Lint workflows
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -oneline
  build:
    name: Build ${{ matrix.os-version }} package
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-version: buster,   version_tag: "4.19" }
          - { os-version: bullseye, version_tag: "5.10.140" }
          - { os-version: bookworm, version_tag: "6.1" }
          - { os-version: trixie,   version_tag: "6.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image, package, dkms smoke test
        run: |
          docker build -t "aufs-build:${{ matrix.os-version }}" \
            --build-arg "FLAVOR=${{ matrix.os-version }}" docker/
          docker run --rm -w /src \
            -e "DEB_FLAVOR=${{ matrix.os-version }}" \
            -e "VERSION_TAG=${{ matrix.version_tag }}" \
            -v "${{ github.workspace }}:/src" \
            "aufs-build:${{ matrix.os-version }}" bash -ec '
              ./scripts/build.sh
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends linux-headers-amd64 kmod
              dpkg -i ./aufs-dkms_*.deb || true
              if find /var/lib/dkms -name aufs.ko -print -quit | grep -q .; then
                echo "aufs.ko built and installed for this kernel"
              elif grep -rqs "does not export the symbols" /var/lib/dkms/; then
                echo "stock kernel lacks aufs exports (expected on this release)"
              else
                echo "::error::unexpected dkms build failure"
                find /var/lib/dkms -name make.log -exec tail -40 {} +
                exit 1
              fi'
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-ci-${{ matrix.os-version }}
          path: ./*.deb
          if-no-files-found: ignore

  integration:
    # Buster's stock 4.19 kernel exports the symbols aufs needs, so this is a
    # real end-to-end test: install the deb inside a buster cloud VM, load the
    # dkms-built module and exercise an actual union mount.
    name: Integration test (buster VM)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download buster package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-ci-buster
          path: packages
      - name: Set up QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fetch buster cloud image
        run: |
          base="https://cloud.debian.org/images/cloud/buster/latest"
          # keep the upstream filename: SHA512SUMS references it by name
          curl -fsSL -o debian-10-generic-amd64.qcow2 \
            "${base}/debian-10-generic-amd64.qcow2"
          curl -fsSL "${base}/SHA512SUMS" \
            | grep 'debian-10-generic-amd64\.qcow2$' | sha512sum -c -
      - name: Boot VM
        run: |
          ssh-keygen -t ed25519 -N '' -f vm_key -q
          printf '#cloud-config\nssh_authorized_keys:\n  - %s\n' \
            "$(cat vm_key.pub)" > user-data
          printf 'instance-id: aufs-ci\nlocal-hostname: aufs-itest\n' > meta-data
          cloud-localds seed.iso user-data meta-data
          accel=tcg; [ -w /dev/kvm ] && accel=kvm
          qemu-system-x86_64 -accel "${accel}" -m 2048 -smp 2 -display none \
            -drive file=debian-10-generic-amd64.qcow2,if=virtio,format=qcow2,snapshot=on \
            -drive file=seed.iso,if=virtio,format=raw,media=cdrom \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=n0 &
          for _ in $(seq 1 60); do
            sleep 5
            ssh -i vm_key -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -p 2222 debian@127.0.0.1 true 2>/dev/null && exit 0
          done
          echo "::error::VM did not accept SSH within timeout"
          exit 1
      - name: Run in-guest integration test
        run: |
          scp -i vm_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -P 2222 packages/aufs-dkms_*_all.deb scripts/integration-test.sh \
            debian@127.0.0.1:~/
          ssh -i vm_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -p 2222 \
            debian@127.0.0.1 'bash integration-test.sh'
      - name: Stop VM
        if: always()
        run: pkill -f qemu-system-x86_64 || true

  integration-kernel:
    # Real end-to-end test on the patched kernel: boot a cloud VM on the
    # stock kernel, install the aufs-enabled kernel packages published by
    # build-kernel.yml, kexec into the aufs-amd64 kernel, then install the
    # dkms deb, load the module and exercise a union mount. Skips cleanly
    # until the first kernel-* release for a flavor exists.
    name: Integration test (${{ matrix.os-version }}, aufs kernel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-version: bullseye, image: debian-11-generic-amd64.qcow2, port: 2224 }
          - { os-version: bookworm, image: debian-12-generic-amd64.qcow2, port: 2225 }
          - { os-version: trixie,   image: debian-13-generic-amd64.qcow2, port: 2226 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ${{ matrix.os-version }} aufs package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-ci-${{ matrix.os-version }}
          path: packages
      - name: Fetch latest aufs kernel packages
        id: krel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release list --repo "${GITHUB_REPOSITORY}" \
            --json tagName --limit 200 \
            --jq "[.[].tagName | select(startswith(\"kernel-${{ matrix.os-version }}-\"))] | first")"
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::notice::no kernel-${{ matrix.os-version }}-* release published yet, skipping VM test"
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "found=true" >> "${GITHUB_OUTPUT}"
          mkdir -p kernel
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.deb' --dir kernel --clobber
          ls -la kernel/
      - name: Set up QEMU
        if: steps.krel.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fetch ${{ matrix.os-version }} cloud image
        if: steps.krel.outputs.found == 'true'
        run: |
          base="https://cloud.debian.org/images/cloud/${{ matrix.os-version }}/latest"
          # keep the upstream filename: SHA512SUMS references it by name
          curl -fsSL -o "${{ matrix.image }}" "${base}/${{ matrix.image }}"
          curl -fsSL "${base}/SHA512SUMS" \
            | grep '${{ matrix.image }}$' | sha512sum -c -
      - name: Boot VM (stock kernel)
        if: steps.krel.outputs.found == 'true'
        run: |
          ssh-keygen -t ed25519 -N '' -f vm_key -q
          printf '#cloud-config\nssh_authorized_keys:\n  - %s\n' \
            "$(cat vm_key.pub)" > user-data
          printf 'instance-id: aufs-ci-%s\nlocal-hostname: aufs-ktest\n' \
            "${{ matrix.os-version }}" > meta-data
          cloud-localds seed.iso user-data meta-data
          accel=tcg; [ -w /dev/kvm ] && accel=kvm
          qemu-system-x86_64 -accel "${accel}" -m 2048 -smp 2 -display none \
            -drive file=${{ matrix.image }},if=virtio,format=qcow2,snapshot=on \
            -drive file=seed.iso,if=virtio,format=raw,media=cdrom \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:${{ matrix.port }}-:22 \
            -device virtio-net-pci,netdev=n0 &
          for _ in $(seq 1 60); do
            sleep 5
            ssh -i vm_key -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -p ${{ matrix.port }} debian@127.0.0.1 true 2>/dev/null && exit 0
          done
          echo "::error::VM did not accept SSH within timeout"
          exit 1
      - name: Install aufs kernel and reboot into it
        if: steps.krel.outputs.found == 'true'
        run: |
          ssho=(-i vm_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          scp "${ssho[@]}" -P ${{ matrix.port }} kernel/*.deb packages/aufs-dkms_*_all.deb \
            scripts/integration-test.sh debian@127.0.0.1:~/
          ssh "${ssho[@]}" -p ${{ matrix.port }} debian@127.0.0.1 '
            set -e
            case "$(. /etc/os-release && echo "${VERSION_CODENAME}")" in
              bullseye)
                printf "%s\n" \
                  "deb http://archive.debian.org/debian bullseye main" \
                  "deb http://archive.debian.org/debian bullseye-updates main" \
                  "deb http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main" \
                  | sudo tee /etc/apt/sources.list >/dev/null
                echo "Acquire::Check-Valid-Until \"false\";" \
                  | sudo tee /etc/apt/apt.conf.d/99_archive >/dev/null ;;
            esac
            sudo apt-get update -qq
            sudo apt-get install -y -qq ./linux-image-*-aufs-amd64_*.deb \
              ./linux-headers-*-aufs-amd64_*.deb ./linux-headers-*-common_*_all.deb \
              ./linux-kbuild-*_amd64.deb kexec-tools dkms kmod
            kv="$(ls /boot/vmlinuz-*-aufs-amd64 | head -1)"
            kver="${kv#/boot/vmlinuz-}"
            sudo kexec -l "${kv}" --initrd="/boot/initrd.img-${kver}" --reuse-cmdline
            sudo kexec -e' || true
          # kexec -e drops the SSH connection; wait for the new kernel
          for _ in $(seq 1 60); do
            sleep 5
            out="$(ssh "${ssho[@]}" -o ConnectTimeout=5 -p ${{ matrix.port }} \
              debian@127.0.0.1 'uname -r' 2>/dev/null)" && {
              echo "running kernel: ${out}"
              case "${out}" in *aufs*) exit 0 ;; *) exit 1 ;; esac
            }
          done
          echo "::error::VM did not come back on the aufs kernel"
          exit 1
      - name: Run in-guest integration test
        if: steps.krel.outputs.found == 'true'
        run: |
          ssh -i vm_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -p ${{ matrix.port }} \
            debian@127.0.0.1 'bash integration-test.sh'
      - name: Stop VM
        if: always()
        run: pkill -f 'qemu-system-x86_64' || true
