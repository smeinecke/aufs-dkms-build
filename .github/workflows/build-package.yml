# This is a basic workflow that is manually triggered

name: build release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian Version'
        options:
          - 'trixie'
          - 'bookworm'
          - 'bullseye'
          - 'buster'
        required: true
      version_tag:
        description: 'Version Tag (trixie=6.12, bookworm=6.1, bullseye=5.10.140, buster=4.19)'
        default: '6.12'
        required: true
      release:
        type: boolean
        description: "publish to repository"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: "smeinecke/aufs-dkms-build:${{ github.event.inputs.flavor }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run build script
        run: ./scripts/build.sh
        env:
          DEB_FLAVOR: "${{ github.event.inputs.flavor }}"
          VERSION_TAG: "${{ github.event.inputs.version_tag }}"
      - name: Upload deb files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ github.event.inputs.flavor }}
          path: ./*.deb
      - name: Release
        if: github.event.inputs.release && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./*.deb

  # Docker actions cannot run inside the build job's container (the image has
  # no docker CLI), so the apt publish runs as a separate job like in
  # build-full.yml / build-kernel.yml — serialized with the other workflows
  # via the shared concurrency group.
  apt:
    name: Publish package to apt repository
    needs: build
    if: github.event.inputs.release
    runs-on: ubuntu-latest
    concurrency: apt-repo-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.event.inputs.flavor }}
          path: packages
      - name: Github pages APT repo
        if: hashFiles('packages/*.deb') != ''
        uses: smeinecke/apt-repo-action@80277dede047fa054a3d11968b133bafe8cd04ff # v2.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: |
            buster
            bullseye
            bookworm
            trixie
          file: |
            packages/*.deb
          file_target_version: "${{ github.event.inputs.flavor }}"
          public_key: ${{ secrets.APT_PUBLIC_KEY }}
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
