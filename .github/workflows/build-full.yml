name: build full release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      version_tag:
        description: 'Version Tag'
        default: '6.12'
        required: true
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-version: buster,   version_tag: "4.19" }
          - { os-version: bullseye, version_tag: "5.10.140" }
          - { os-version: bookworm, version_tag: "6.1" }
          - { os-version: trixie,   version_tag: "6.12" }
    container:
      image: "smeinecke/aufs-dkms-build:${{ matrix.os-version }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set env (flavor default)
        run: echo "VERSION_TAG=${{ matrix.version_tag }}" >> "$GITHUB_ENV"
      - name: Set env (git tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"
      - name: Set env (workflow input)
        if: github.event.inputs.version_tag != ''
        run: echo "VERSION_TAG=${{ github.event.inputs.version_tag }}" >> "$GITHUB_ENV"
      - name: Run build script
        run: |
          # POSIX (this step runs under sh inside the container); strip a
          # "+<date>" rebuild suffix before matching the kernel series
          series="$(printf '%s' "${VERSION_TAG%%+*}" | cut -d. -f1-2)"
          case "${DEB_FLAVOR}" in
            buster)   want=4.19 ;;
            bullseye) want=5.10 ;;
            bookworm) want=6.1 ;;
            trixie)   want=6.12 ;;
          esac
          if [ "${series}" != "${want}" ]; then
            echo "skipping ${DEB_FLAVOR}: tag ${VERSION_TAG} targets kernel ${series}"
            # keep the artifact non-empty for add_release; must NOT be a dotfile
            # (upload-artifact skips hidden files unless include-hidden-files)
            touch no-debs
          else
            ./scripts/build.sh
          fi
        env:
          DEB_FLAVOR: "${{ matrix.os-version }}"
      - name: Upload deb files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os-version }}
          path: |
            ./*.deb
            ./no-debs
  release:
    name: Add package to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os-version: ["buster", "bullseye", "bookworm", "trixie"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "packages-${{ matrix.os-version }}"
          path: packages
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: hashFiles('packages/*.deb') != ''
        with:
          # tag pushes release under their own name; dispatches create the
          # tag + release named after the requested version_tag
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          files: packages/*.deb

  # All apt publishes push the same gh-pages branch, so they must not run
  # concurrently -- across workflows AND across matrix legs. Job-level
  # concurrency only keeps ONE pending job per group (a matrix would cancel
  # its own pending legs), so this is a single job with one step per distro.
  apt:
    name: Publish packages to apt repository
    needs: build
    runs-on: ubuntu-latest
    concurrency: apt-repo-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "packages-*"
          path: artifacts
      - name: Add buster package to apt repository
        if: hashFiles('artifacts/packages-buster/*.deb') != ''
        uses: smeinecke/apt-repo-action@f7bfcf90edda137bd1c808863ae2bc24cea959df # v2.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: |
            buster
            bullseye
            bookworm
            trixie
          file: |
            artifacts/packages-buster/*.deb
          file_target_version: buster
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ secrets.APT_SIGNING_PUBKEY }}
          key_passphrase: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
      - name: Add bullseye package to apt repository
        if: hashFiles('artifacts/packages-bullseye/*.deb') != ''
        uses: smeinecke/apt-repo-action@f7bfcf90edda137bd1c808863ae2bc24cea959df # v2.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: |
            buster
            bullseye
            bookworm
            trixie
          file: |
            artifacts/packages-bullseye/*.deb
          file_target_version: bullseye
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ secrets.APT_SIGNING_PUBKEY }}
          key_passphrase: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
      - name: Add bookworm package to apt repository
        if: hashFiles('artifacts/packages-bookworm/*.deb') != ''
        uses: smeinecke/apt-repo-action@f7bfcf90edda137bd1c808863ae2bc24cea959df # v2.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: |
            buster
            bullseye
            bookworm
            trixie
          file: |
            artifacts/packages-bookworm/*.deb
          file_target_version: bookworm
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ secrets.APT_SIGNING_PUBKEY }}
          key_passphrase: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
      - name: Add trixie package to apt repository
        if: hashFiles('artifacts/packages-trixie/*.deb') != ''
        uses: smeinecke/apt-repo-action@f7bfcf90edda137bd1c808863ae2bc24cea959df # v2.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: |
            buster
            bullseye
            bookworm
            trixie
          file: |
            artifacts/packages-trixie/*.deb
          file_target_version: trixie
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ secrets.APT_SIGNING_PUBKEY }}
          key_passphrase: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
